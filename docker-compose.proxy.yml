# Optional HTTPS reverse proxy. Combine with either base compose file:
#   docker compose -f docker-compose.yml -f docker-compose.proxy.yml up -d --build
#   docker compose -f docker-compose.prebuilt.yml -f docker-compose.proxy.yml up -d
#
# Only needed if you want a real domain with automatic HTTPS. A LAN-only
# instance over plain http:// works without any of this: set
# PUBLIC_INSTANCE=false in .env and use the base compose file alone.
#
# Before starting:
#   1. cp Caddyfile.example Caddyfile   and put your domain in it
#   2. in .env: ORIGIN=https://your.domain  and remove any PUBLIC_INSTANCE=false
#      (secure cookies are the default, which is what you want behind TLS)
#   3. point your domain's DNS at this host, with ports 80 and 443 reachable
#      from the Internet (Caddy needs both to obtain a certificate)
#
# See docs/reverse-proxy.md.
services:
  budgetpilot:
    # The app is no longer published on the host: Caddy reaches it over the
    # internal Compose network, and it is the only way in.
    #
    # The `!reset` tag is load-bearing and must not be simplified to a plain
    # `ports: []`. Compose merges sequences from several -f files by APPENDING,
    # so an empty list appends nothing and the base file's
    # "${APP_PORT:-3000}:3000" mapping silently survives: the app stays
    # published on 0.0.0.0 while the block below trusts a forwarded client
    # address, which together let anyone reaching that port forge their own
    # address and reset every per-IP rate limit at will.
    # `!reset` removes the key outright, which is the only thing that actually
    # cancels it. Requires Compose >= 2.24 (see docs/reverse-proxy.md).
    ports: !reset []
    environment:
      # Without a trusted-proxy allowlist, every request reaches the app with Caddy's
      # container IP, collapsing every per-IP rate limit (login, MFA, registration,
      # bank-sync consent) into a single shared bucket. The app trusts the real client
      # from X-Forwarded-For ONLY when the socket peer is inside TRUSTED_PROXIES; the
      # network below is pinned to 172.28.5.0/24, so it trusts Caddy and nothing else.
      # It validates the header itself (do NOT set ADDRESS_HEADER: that makes the
      # framework trust the header from anyone, and the app now refuses to boot if it is
      # set, see #219). Combined with `ports: !reset []` above (Caddy is the sole way
      # in), a client that could reach the app directly is on a different peer address
      # and its forged header is ignored.
      TRUSTED_PROXIES: 172.28.5.0/24

  caddy:
    image: caddy:2-alpine
    container_name: budgetpilot_caddy
    depends_on:
      - budgetpilot
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

# Pinned so TRUSTED_PROXIES above is a fixed, knowable value rather than whatever subnet
# Docker happens to assign. Caddy and the app both get an address in this /24.
networks:
  default:
    ipam:
      config:
        - subnet: 172.28.5.0/24

volumes:
  caddy_data:
  caddy_config:
