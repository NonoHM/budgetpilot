# Optional NVIDIA GPU acceleration for the AI overlay. Always goes on top of
# docker-compose.ai.yml, never instead of it. Add it to the COMPOSE_FILE line in .env,
# after docker-compose.ai.yml, for example
#   COMPOSE_FILE=docker-compose.prebuilt.yml:docker-compose.ai.yml:docker-compose.ai.gpu.yml
# (docker-compose.yml first on a source checkout, docker-compose.override.yml last
# if you have one), then run `docker compose up -d`.
# docs/operations.md « Your Compose files » explains the line.
#
# Requires an NVIDIA GPU and nvidia-container-toolkit installed on the host. If
# either is missing, `up` fails on the ollama service with "could not select
# device driver \"nvidia\" with capabilities: [[gpu]]". That is the whole reason
# this is a separate file: without it the AI overlay runs on the CPU on any
# machine, which is slower and always starts.
#
# Nothing else changes. The model, the timeout and the host allowlist all stay
# where they are, in docker-compose.ai.yml. See docs/reference/ai-model.md.
services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
