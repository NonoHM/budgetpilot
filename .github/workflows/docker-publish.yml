name: Docker publish

# Runs only when a GitHub Release is published — i.e. after the release-please
# Release PR (see release-please.yml) is merged and it creates the tag +
# release. Never on a plain push, so no image is published without that
# explicit human-approved step.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to publish (e.g. budgetpilot-v0.1.1). Use this to publish a release retroactively when its published event never fired'
        required: true

# Least privilege: read-only by default. packages: write is declared on the two jobs that push
# to the registry (build, merge); every other job that needs it already narrows explicitly
# (OpenSSF Token-Permissions).
permissions:
  contents: read

# What a valid signature from this project looks like, in one place, because the same two values
# appear in the signing job, in the verification job, and in the command operators are given in
# docs/operations.md. If they ever drift apart, verification passes here and fails for the user.
#
# The identity is the workflow file itself, at a TAG ref: keyless signing binds the certificate to
# the workflow that requested it, so pinning this is what makes the signature mean "budgetpilot
# published this" rather than "somebody signed this". `refs/tags/` matters as much as the path,
# since it refuses anything signed from a branch, including a fork's copy of this file.
#
# THE `BP_` PREFIX IS LOAD-BEARING AND THESE MUST NEVER BE NAMED `COSIGN_*`. cosign binds its
# flags to environment variables under that prefix, so a workflow-level `env:` entry called
# COSIGN_OIDC_ISSUER is not an inert string of ours: cosign reads it as an explicit OIDC service
# URL. Workflow-level env reaches every step, so it reached `cosign sign`, which refused with
# "cannot specify service URLs and use signing config" because cosign v3 takes those endpoints
# from its TUF-distributed signing config instead. That is exactly how 0.11.0 shipped unsigned.
# Reproduced locally with cosign v3.1.3: identical command, the variable set versus unset, error
# versus normal start. Keep our own values outside any namespace a tool we invoke owns.
env:
  BP_SIGN_IDENTITY_REGEXP: '^https://github\.com/NonoHM/budgetpilot/\.github/workflows/docker-publish\.yml@refs/tags/'
  BP_SIGN_OIDC_ISSUER: https://token.actions.githubusercontent.com

jobs:
  # Computes the version/image name/tags once so every other job (and both
  # platform builds) uses the exact same values — nothing is recomputed
  # per-matrix-leg.
  prepare:
    runs-on: ubuntu-latest
    # Computes strings; needs neither the registry nor write access. packages: write is
    # declared only on build and merge (the two jobs that push); this job stays read-only.
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      image: ${{ steps.image.outputs.name }}
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
    steps:
      # Every job here checks out `github.ref`, while the version comes from `tag_name` — and
      # nothing made the two agree. Dispatching this workflow from `main` with
      # `tag_name: budgetpilot-v0.1.1` built main's HEAD and pushed it as both `:0.1.1` and
      # `:latest`. The docker-smoke gate does not catch that: it checks out the same ref, so it
      # faithfully tests main and passes. The gate was working; it was guarding a different
      # artifact than the tag name advertised.
      #
      # On a `release: published` event this passes by construction (github.ref is the tag). For
      # workflow_dispatch it means selecting the tag as the ref to run on, which is what the
      # input's description already assumes.
      - name: Refuse to publish a ref that is not the tag being named
        env:
          TAG_NAME: ${{ github.event.inputs.tag_name || github.event.release.tag_name }}
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "Run this from a tag. Got $GITHUB_REF_TYPE \"$GITHUB_REF_NAME\"." >&2
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "$TAG_NAME" ]; then
            echo "Checked-out tag \"$GITHUB_REF_NAME\" does not match tag_name \"$TAG_NAME\"." >&2
            exit 1
          fi

      - name: Extract version from release tag
        id: version
        env:
          # release-please's tag format is "<component>-v<version>" (component prefix on by
          # default) — e.g. "budgetpilot-v0.1.1". Strip up to the first "-v" first, then a
          # leading bare "v" as a fallback, so this also handles a plain "vX.Y.Z" tag if the
          # component-prefix config setting ever changes.
          TAG_NAME: ${{ github.event.inputs.tag_name || github.event.release.tag_name }}
        run: |
          version="${TAG_NAME#*-v}"
          version="${version#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Lowercase repository name (GHCR requires it)
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          echo "name=${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ghcr.io/${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest

  # Builds the image and boots it on every provider before a single layer reaches GHCR. It runs
  # on pull requests too (see ci.yml), but repeating it here is not redundant: this workflow
  # publishes from a release tag, which is a different commit from whatever last passed CI, and
  # `workflow_dispatch` can be pointed at a tag nobody re-checked. A published image is the one
  # artifact users pull without reading anything, so the gate belongs on the publish path itself.
  smoke:
    uses: ./.github/workflows/docker-smoke.yml

  # One native leg per platform — no QEMU emulation. GitHub's free arm64 hosted
  # runner (ubuntu-24.04-arm) builds bcrypt/better-sqlite3 at native speed
  # instead of emulated. Each leg pushes its own platform image to GHCR by
  # digest only (no tag yet); the merge job below assembles the real tags as a
  # multi-arch manifest list from these digests.
  build:
    needs: [prepare, smoke]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write # push image by digest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ needs.prepare.outputs.labels }}
          # provenance/sbom off: buildx defaults provenance to "mode=min" whenever it pushes,
          # which adds an extra unknown/unknown "attestation-manifest" entry per platform to
          # the final index (visible in `docker manifest inspect` alongside the real
          # linux/amd64 and linux/arm64 entries) — noise for a local-first app with no
          # supply-chain-attestation requirement, not a bug in the digest/merge flow itself.
          provenance: false
          sbom: false
          outputs: type=image,name=ghcr.io/${{ needs.prepare.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Sanitize platform name for artifact key
        id: platform-key
        run: echo "key=${platform//\//-}" >> "$GITHUB_OUTPUT"
        env:
          platform: ${{ matrix.platform }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digests-${{ steps.platform-key.outputs.key }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # CVE gate: no CRITICAL/HIGH *fixable* vulnerability reaches a pullable tag. It sits between
  # the per-digest pushes and the tagged merge — the same honest compromise verify-arm64 already
  # documents: the untagged digests exist in GHCR either way; what this job controls is what a
  # user can pull by tag.
  #
  # `ignore-unfixed: true` on this gate only, and deliberately: a CVE Debian has not fixed yet
  # would block releases on something no rebuild of ours can remove. The scheduled scan
  # (trivy-scheduled.yml) runs WITHOUT ignore-unfixed and reports those — awareness there,
  # gating here. Both platform digests are gated: they are built from one distroless index and
  # the same Debian snapshot, but "same packages" is a claim to verify per release, not assume.
  #
  # The SARIF step scans with no severity filter and no ignore-unfixed on purpose — the
  # Security tab gets the inventory (it filters natively); only the gate applies policy.
  # Alerts uploaded here land under the release tag's ref; the daily default-branch view
  # comes from trivy-scheduled.yml.
  #
  # The one carve-out, added 2026-08-02: `.trivyignore` at the repo root is auto-detected by
  # Trivy from the working directory, so it filters the SARIF inventory. The two gates below
  # opt back out with `TRIVY_IGNOREFILE=/dev/null` — suppression is a Security-tab noise
  # decision and must never be able to unblock a release. Without that, a CRITICAL/HIGH line
  # added to `.trivyignore` would silently pass this gate; with it, the gate cannot be
  # weakened by editing that file at all. Verified by scanning with the file present and the
  # override set: all 12 findings reappear.
  scan:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      security-events: write # upload-sarif
    steps:
      # Two things, not one: upload-sarif's source context, AND `.trivyignore` — Trivy
      # auto-detects it in the working directory, which is this checkout. Drop the checkout
      # and the suppressions silently stop applying while every scan still passes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: digests-linux-amd64
          path: /tmp/scan-digests/amd64

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: digests-linux-arm64
          path: /tmp/scan-digests/arm64

      # The build job records each platform digest as an empty file named after the hex — the
      # same encoding the merge job consumes. Exactly one per platform, or something upstream
      # changed shape and this gate must fail rather than scan half the matrix; and the name
      # must actually be a sha256 hex, or the refs below are garbage that fails later with a
      # worse error.
      - name: Resolve per-platform image refs
        id: refs
        env:
          IMAGE: ghcr.io/${{ needs.prepare.outputs.image }}
        run: |
          shopt -s nullglob
          for platform in amd64 arm64; do
            files=(/tmp/scan-digests/"$platform"/*)
            if [ "${#files[@]}" -ne 1 ]; then
              echo "expected exactly one $platform digest file, found ${#files[@]}" >&2
              exit 1
            fi
            digest=$(basename "${files[0]}")
            case "$digest" in
              *[!0-9a-f]* | '') echo "digest file name is not hex: $digest" >&2; exit 1 ;;
            esac
            if [ "${#digest}" -ne 64 ]; then
              echo "not a sha256 hex digest: $digest" >&2
              exit 1
            fi
            echo "$platform=$IMAGE@sha256:$digest" >> "$GITHUB_OUTPUT"
          done

      - name: Scan amd64 digest (full inventory as SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.refs.outputs.amd64 }}
          scanners: vuln
          format: sarif
          output: trivy-release-amd64.sarif

      - name: Upload amd64 results to the Security tab
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: trivy-release-amd64.sarif
          category: trivy-image-release-amd64

      - name: Scan arm64 digest (full inventory as SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.refs.outputs.arm64 }}
          scanners: vuln
          format: sarif
          output: trivy-release-arm64.sarif
          skip-setup-trivy: true

      - name: Upload arm64 results to the Security tab
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: trivy-release-arm64.sarif
          category: trivy-image-release-arm64

      # A scanner that sees zero packages exits 0 and the gate below passes green while
      # proving nothing — the empty-scan failure mode. setup-trivy (run by the first
      # trivy-action step) leaves `trivy` on PATH and the vulnerability DB in its cache,
      # so this probe costs one cached scan per platform.
      - name: Refuse to gate on an empty package inventory
        env:
          AMD64_REF: ${{ steps.refs.outputs.amd64 }}
          ARM64_REF: ${{ steps.refs.outputs.arm64 }}
        run: |
          for ref in "$AMD64_REF" "$ARM64_REF"; do
            count=$(trivy image --quiet --scanners vuln --format json --list-all-pkgs "$ref" \
              | jq '[.Results[]?.Packages? // []] | flatten | length')
            echo "$ref: $count packages"
            if [ "$count" -eq 0 ]; then
              echo "the scanner saw zero packages in $ref. The CVE gate would pass while proving nothing" >&2
              exit 1
            fi
          done

      - name: Gate amd64 on fixable CRITICAL/HIGH
        id: gate-amd64
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_IGNOREFILE: /dev/null # `.trivyignore` must not be able to unblock a release
        with:
          scan-type: image
          image-ref: ${{ steps.refs.outputs.amd64 }}
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: json
          output: gate-amd64.json
          skip-setup-trivy: true

      # What blocked the release, in the form someone acts on. The default table prints one row
      # per scanned TARGET including every clean one — 651 lines for 2 findings on the published
      # image — so the reason a release stopped was buried under three hundred empty rows. The
      # full inventory is not lost: the SARIF upload above carries every severity to the Security
      # tab, which is where completeness belongs.
      - name: Say what amd64 blocked on
        if: always() && steps.gate-amd64.outcome == 'failure'
        run: ./scripts/trivy-report.sh gate-amd64.json "amd64" >> "$GITHUB_STEP_SUMMARY"

      - name: Gate arm64 on fixable CRITICAL/HIGH
        id: gate-arm64
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_IGNOREFILE: /dev/null # `.trivyignore` must not be able to unblock a release
        with:
          scan-type: image
          image-ref: ${{ steps.refs.outputs.arm64 }}
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: json
          output: gate-arm64.json
          skip-setup-trivy: true

      # What blocked the release, in the form someone acts on. The default table prints one row
      # per scanned TARGET including every clean one — 651 lines for 2 findings on the published
      # image — so the reason a release stopped was buried under three hundred empty rows. The
      # full inventory is not lost: the SARIF upload above carries every severity to the Security
      # tab, which is where completeness belongs.
      - name: Say what arm64 blocked on
        if: always() && steps.gate-arm64.outcome == 'failure'
        run: ./scripts/trivy-report.sh gate-arm64.json "arm64" >> "$GITHUB_STEP_SUMMARY"

  # Combines the amd64 + arm64 digests into a single multi-arch manifest list
  # under the real tags (version + latest) — `docker buildx imagetools create`
  # is the standard way to do this without re-uploading any image data.
  merge:
    needs: [prepare, build, scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push the multi-arch manifest
    outputs:
      # The digest of the manifest LIST, which is what `sign` signs and what an operator's
      # `cosign verify` resolves a tag to. Not either platform digest: those are its children.
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        env:
          IMAGE: ghcr.io/${{ needs.prepare.outputs.image }}
          TAGS: ${{ needs.prepare.outputs.tags }}
        run: |
          tag_args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && tag_args+=(-t "$tag")
          done <<< "$TAGS"
          digest_refs=()
          for digest in *; do
            digest_refs+=("$IMAGE@sha256:$digest")
          done
          docker buildx imagetools create "${tag_args[@]}" "${digest_refs[@]}"

      - name: Inspect pushed manifest
        env:
          IMAGE: ghcr.io/${{ needs.prepare.outputs.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: docker buildx imagetools inspect "$IMAGE:$VERSION"

      # Resolved from the registry rather than recomputed, so `sign` and `verify-signature`
      # act on the object a user pulling this tag actually receives. Shape-checked for the
      # same reason the scan job checks its digest files: a garbled value here would fail
      # later with a much worse error, and an EMPTY one would make `cosign sign` operate on
      # a bare tag, which signs whatever that tag points at at some later moment.
      - name: Record the index digest
        id: digest
        env:
          IMAGE: ghcr.io/${{ needs.prepare.outputs.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{.Manifest.Digest}}')
          case "$digest" in
            sha256:*) ;;
            *) echo "not a sha256 digest: $digest" >&2; exit 1 ;;
          esac
          hex=${digest#sha256:}
          case "$hex" in
            *[!0-9a-f]* | '') echo "digest is not hex: $digest" >&2; exit 1 ;;
          esac
          if [ "${#hex}" -ne 64 ]; then
            echo "digest is not 64 hex characters: $digest" >&2
            exit 1
          fi
          echo "index digest: $digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  # Pulls the just-published manifest tag on a native arm64 runner and checks
  # the actual downloaded image reports linux/arm64 — proof the arm64 layer
  # served to a real arm64 machine isn't an emulated amd64 blob, with no QEMU
  # anywhere in this check either.
  verify-arm64:
    needs: [prepare, merge]
    runs-on: ubuntu-24.04-arm
    # Anonymous pull of the (public) published tag; no token use at all.
    permissions:
      contents: read
    steps:
      - name: Pull and verify architecture
        env:
          IMAGE: ghcr.io/${{ needs.prepare.outputs.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
          DOCKER_CLI_EXPERIMENTAL: enabled
        run: |
          docker pull "$IMAGE:$VERSION"
          arch="$(docker inspect --format '{{.Architecture}}' "$IMAGE:$VERSION")"
          echo "Pulled architecture: $arch"
          test "$arch" = "arm64"
          docker manifest inspect "$IMAGE:$VERSION"

      # Reporting linux/arm64 and *running* on linux/arm64 are different claims, and only the
      # second one matters to someone pulling this tag. The docker-smoke gate above builds and
      # boots on the runner's own architecture, which is amd64 — so without this step the arm64
      # half of the published manifest is the one thing never executed anywhere. Native
      # dependencies (bcrypt, better-sqlite3) are compiled per-platform, so it is also the half
      # most likely to break.
      #
      # It covers one more native binary than it looks like it does. The container runs
      # `prisma migrate deploy` before it serves anything, so reaching /login means the arm64
      # build of Prisma's schema-engine — an ELF, not JavaScript — executed against this base's
      # glibc and OpenSSL. That is the piece with no fallback path if the runtime image's base
      # ever drifts from the builder's.
      #
      # SQLite and the image's default DATABASE_URL only: this is an architecture check, not a
      # provider check. The three secrets are throwaway values for a container that lives about
      # a minute.
      - name: Boot the published arm64 image
        env:
          IMAGE: ghcr.io/${{ needs.prepare.outputs.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          docker run -d --name verify-arm64 -p 127.0.0.1:3000:3000 \
            -e TOTP_ENCRYPTION_KEY=c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1 \
            -e RATE_LIMIT_HASH_SECRET=publish-check-only-fake-secret \
            -e BOOTSTRAP_TOKEN=publish-check-only-fake-token \
            -e ORIGIN=http://127.0.0.1:3000 \
            "$IMAGE:$VERSION"

          for _ in $(seq 1 90); do
            if [ "$(docker inspect -f '{{.State.Running}}' verify-arm64)" != "true" ]; then
              break
            fi
            if curl -fs -o /dev/null http://127.0.0.1:3000/login 2>/dev/null; then
              echo "The published arm64 image booted and served /login."
              docker rm -f verify-arm64 >/dev/null
              exit 0
            fi
            sleep 1
          done

          docker logs verify-arm64 || true
          docker rm -f verify-arm64 >/dev/null 2>&1 || true
          echo "The published arm64 image never served /login." >&2
          exit 1

  # SBOM for the release: generated by Syft from the just-published tag and attached to the
  # GitHub release as an SPDX JSON asset. Syft rather than Trivy for *generation* (richer npm
  # coverage of the node_modules tree); Trivy stays the scanner. buildx's own sbom/provenance
  # remains off — the unknown/unknown attestation-manifest rationale at build-push-action
  # stands, and is not re-litigated here: the SBOM ships next to the release notes instead of
  # inside the manifest list. One format (SPDX JSON) until someone needs another; a second
  # --clobber'ed asset is a one-line addition later.
  #
  # Generation and upload are separate jobs on purpose: sbom runs a third-party action, and a
  # third-party action never shares a job with a token that can write to the repository —
  # any step in a job can read every credential the job holds. This job gets read-only;
  # only sbom-attach below, which runs no third-party code, holds contents: write.
  sbom:
    needs: [prepare, merge]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - name: Generate SBOM (Syft, SPDX JSON)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ghcr.io/${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.version }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: budgetpilot-${{ needs.prepare.outputs.version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom
          path: budgetpilot-*.spdx.json
          if-no-files-found: error
          retention-days: 1

  # Signs what ships, in the two places a user can check it (#218, ASVS 10.3).
  #
  # Keyless, via the workflow's own OIDC identity: Fulcio issues a ~10-minute certificate bound
  # to `.github/workflows/docker-publish.yml@refs/tags/<tag>`, and the record goes to the public
  # Rekor log. There is no private key in a secret, so there is nothing to rotate and nothing to
  # leak. Same fail-closed reasoning as the rest of this programme: a secret that does not exist
  # cannot be stolen. What replaces "guard the key" is "pin the identity", which is why every
  # verify below asserts the certificate identity and issuer rather than merely that a signature
  # exists. A signature that verifies against any identity proves only that SOMEBODY signed it.
  #
  # TWO artefacts, because they protect different people and only one of them is what OpenSSF
  # Scorecard's Signed-Releases check reads:
  #
  #   1. The IMAGE in GHCR. This is the one that matters: it is what `docker pull` fetches, and
  #      the only thing standing between an operator and a substituted image. Scorecard cannot
  #      see it at all, because that check inspects GitHub release ASSETS and never contacts a
  #      registry (probes/releasesAreSigned, probes/releasesHaveProvenance, both of which iterate
  #      release.Assets).
  #   2. The SBOM asset on the GitHub release, signed as a detached Sigstore bundle. This is what
  #      Scorecard reads, and it is genuinely useful on its own: the SBOM is the file an operator
  #      downloads to answer "what is in this image", and unsigned it is an unattributed claim.
  #
  # --recursive is required and is not a nicety. The published tag is a manifest LIST; signing its
  # digest alone leaves both platform manifests unsigned, so `cosign verify` against the digest an
  # arm64 machine actually resolves would fail while the tag verified fine. -r additionally signs
  # each discrete image, and verify-signature below checks all three.
  #
  # Placed after `scan`, transitively: sbom needs merge, merge needs scan. So nothing is ever
  # signed until the CVE gate has passed, and a gate failure leaves an unsigned image rather than
  # a signed bad one. This does not change #165 (the tag and release already exist by the time any
  # of this runs); it only avoids making it worse.
  sign:
    needs: [prepare, merge, sbom]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # cosign writes the signature alongside the image in GHCR
      id-token: write # mint the OIDC token Fulcio exchanges for a signing certificate
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Pinned for the same reason the actions are pinned by SHA: the signature format and
          # the flags below are properties of a cosign version, not constants.
          cosign-release: v3.1.3

      - uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sbom

      - name: Sign the image, and every architecture inside it
        env:
          IMAGE: ghcr.io/${{ needs.prepare.outputs.image }}
          DIGEST: ${{ needs.merge.outputs.digest }}
        run: cosign sign --yes --recursive "$IMAGE@$DIGEST"

      - name: Sign the SBOM as a detached bundle
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          cosign sign-blob --yes \
            --bundle "budgetpilot-$VERSION.sigstore.json" \
            "budgetpilot-$VERSION.spdx.json"

      # `.sigstore.json` is the conventional extension for a Sigstore bundle, and it is what this
      # file IS. Scorecard counts that suffix as a signature (8 points) and reserves 10 for
      # `.intoto.jsonl`, a different serialisation we do not produce. The check never opens the
      # file, so renaming this one would score the extra 2 points by asserting a format the bytes
      # do not have. That is a false statement about an artefact in exchange for a number, which
      # is the exact failure this whole programme exists to avoid. The name follows the content.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-signature
          path: budgetpilot-*.sigstore.json
          if-no-files-found: error
          retention-days: 1

  # Verifies the signatures that were just made, against the registry, before anyone is told the
  # release is signed. A signing step that is never verified proves only that cosign exited 0.
  #
  # Three positive checks (the index and BOTH platform digests) because --recursive is the thing
  # most likely to be silently dropped later, and its absence is invisible from the tag alone.
  #
  # Two negative controls, because a verify that accepts anything is decorative. Neither can go
  # stale: the first pins an identity nobody can obtain, the second points at an object that
  # exists in our own registry and is never signed by anything.
  verify-signature:
    needs: [prepare, merge, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Anonymous read of the public image and the public Rekor log. No registry write, no token.
    permissions:
      contents: read
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: digests-linux-amd64
          path: /tmp/verify-digests/amd64

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: digests-linux-arm64
          path: /tmp/verify-digests/arm64

      - name: Verify the index and both architectures
        env:
          IMAGE: ghcr.io/${{ needs.prepare.outputs.image }}
          DIGEST: ${{ needs.merge.outputs.digest }}
        run: |
          set -euo pipefail
          # Without nullglob an absent directory yields the literal pattern as a single element,
          # which passes the count check below and then verifies a nonsense ref. Same reason the
          # scan job sets it.
          shopt -s nullglob
          refs=("$IMAGE@$DIGEST")
          for platform in amd64 arm64; do
            files=(/tmp/verify-digests/"$platform"/*)
            if [ "${#files[@]}" -ne 1 ]; then
              echo "expected exactly one $platform digest file, found ${#files[@]}" >&2
              exit 1
            fi
            refs+=("$IMAGE@sha256:$(basename "${files[0]}")")
          done
          for ref in "${refs[@]}"; do
            echo "::group::verify $ref"
            cosign verify \
              --certificate-identity-regexp "$BP_SIGN_IDENTITY_REGEXP" \
              --certificate-oidc-issuer "$BP_SIGN_OIDC_ISSUER" \
              "$ref" > /dev/null
            echo "verified: $ref"
            echo "::endgroup::"
          done

      # BOTH controls below assert the REASON for the refusal, not just a non-zero exit, and that
      # is the whole point rather than pedantry. A first draft of control 2 pointed at the
      # `sha256-<hex>.sig` tag on the theory that a signature artifact is not itself signed.
      # Measured against a signed third-party image before shipping: that tag can simply be
      # ABSENT (cosign v3 can store signatures via the OCI 1.1 referrers API instead), and cosign
      # then fails with `MANIFEST_UNKNOWN`. Non-zero exit, control "passes", and it proved only
      # that a name did not resolve. Exit status alone cannot tell "refused because unsigned"
      # from "refused because missing"; the message can, so the message is what is asserted.
      #
      # The two strings, verified by running them against real registries on 2026-08-13:
      #   unsigned but present  -> "no signatures found"
      #   signed, wrong identity -> "no matching CertificateIdentity found"

      # Control 1: the signature is real and present, so the ONLY thing that can refuse it is the
      # identity pin. This is what proves the pin is load-bearing; without it, a verify carrying a
      # `.*` identity regexp would look identical to the passing checks above.
      - name: Refuse a signature that is not from this repository
        env:
          IMAGE: ghcr.io/${{ needs.prepare.outputs.image }}
          DIGEST: ${{ needs.merge.outputs.digest }}
        run: |
          out=$(cosign verify \
                  --certificate-identity-regexp '^https://github\.com/NonoHM/not-budgetpilot/' \
                  --certificate-oidc-issuer "$BP_SIGN_OIDC_ISSUER" \
                  "$IMAGE@$DIGEST" 2>&1) && {
            echo "cosign accepted a certificate identity that is not this repository" >&2
            exit 1
          }
          case "$out" in
            *"no matching CertificateIdentity found"*)
              echo "refused for the right reason: the certificate identity did not match" ;;
            *)
              echo "refused, but NOT because of the identity pin. This control proved nothing:" >&2
              echo "$out" >&2
              exit 1 ;;
          esac

      # Control 2: an object that EXISTS in our registry and carries no signature, so the refusal
      # is about signing rather than about a name failing to resolve. Pinned to the 0.10.0 index,
      # deliberately: it is the last release published before signing existed, so it can never
      # acquire a signature, which makes it a fixed point rather than a moving target. Asserting
      # the message also catches the day it gets deleted from GHCR, which would otherwise turn
      # this back into the MANIFEST_UNKNOWN false pass described above.
      - name: Refuse an object this workflow never signed
        env:
          UNSIGNED: ghcr.io/nonohm/budgetpilot@sha256:aa5511bab7f7aefd977915c8cad3074b8a35e279c163cffdb548b1b60634ab6d
        run: |
          out=$(cosign verify \
                  --certificate-identity-regexp "$BP_SIGN_IDENTITY_REGEXP" \
                  --certificate-oidc-issuer "$BP_SIGN_OIDC_ISSUER" \
                  "$UNSIGNED" 2>&1) && {
            echo "cosign accepted an object this workflow never signed" >&2
            exit 1
          }
          case "$out" in
            *"no signatures found"*)
              echo "refused for the right reason: the object carries no signature" ;;
            *)
              echo "refused, but NOT because the object is unsigned. This control proved nothing:" >&2
              echo "$out" >&2
              exit 1 ;;
          esac

  # DELIBERATELY INDEPENDENT OF `sign`, and this is the second thing 0.11.0 taught. Attaching the
  # SBOM used to depend on the signing job, so when `sign` failed this job was SKIPPED and the
  # release ended up with no assets at all: a failure in a NEW control destroyed a guarantee that
  # had shipped correctly since 0.7.0. A new control must not be able to take an existing one down
  # with it. The SBOM is independently useful, so it attaches on its own and a signing failure now
  # costs only the signature.
  sbom-attach:
    needs: [prepare, sbom]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # gh release upload — and nothing third-party runs here
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sbom

      # On `release: published` the tag comes from the event; on workflow_dispatch from the
      # input, the same fallback the version step uses. --clobber so a retroactive re-publish
      # of a tag replaces the asset instead of failing on it.
      - name: Attach SBOM to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.event.inputs.tag_name || github.event.release.tag_name }}
        run: gh release upload "$TAG_NAME" budgetpilot-*.spdx.json --clobber

  # The signature travels separately, for the reason on sbom-attach above. Named explicitly rather
  # than by glob so a missing bundle fails loudly: `gh release upload` errors on a path that does
  # not exist, while an unmatched glob would expand to itself and upload a file named after the
  # pattern.
  signature-attach:
    needs: [prepare, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # gh release upload, and nothing third-party runs here
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sbom-signature

      - name: Attach the SBOM signature to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.event.inputs.tag_name || github.event.release.tag_name }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: gh release upload "$TAG_NAME" "budgetpilot-$VERSION.sigstore.json" --clobber
