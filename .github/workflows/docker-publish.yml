name: Docker publish

# Runs only when a GitHub Release is published — i.e. after the release-please
# Release PR (see release-please.yml) is merged and it creates the tag +
# release. Never on a plain push, so no image is published without that
# explicit human-approved step.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to publish (e.g. budgetpilot-v0.1.1) — for retroactively publishing a release whose published event never fired'
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # No explicit `ref:` override: for a release event, checkout already resolves to the
      # tagged commit automatically; for workflow_dispatch, it checks out whatever ref the
      # run was dispatched against (main by default) — which is what we want for a
      # retroactive publish, since the tag itself may predate a since-fixed Dockerfile bug.
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from release tag
        id: version
        env:
          # release-please's tag format is "<component>-v<version>" (component prefix on by
          # default) — e.g. "budgetpilot-v0.1.1". Strip up to the first "-v" first, then a
          # leading bare "v" as a fallback, so this also handles a plain "vX.Y.Z" tag if the
          # component-prefix config setting ever changes.
          TAG_NAME: ${{ github.event.inputs.tag_name || github.event.release.tag_name }}
        run: |
          version="${TAG_NAME#*-v}"
          version="${version#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Lowercase repository name (GHCR requires it)
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          echo "name=${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
