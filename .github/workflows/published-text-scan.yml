# What this repository has ALREADY published, scanned after the fact, daily. The before-the-fact
# guards (the Claude Code hook, the git hooks, the pull request check) cannot see text typed into
# the GitHub web UI, nor anything published before they existed.
#
# Three jobs, independent on purpose: a control that fails must not be able to take the other two
# down with it.
#
# - private-references: the shared matcher (scripts/private-references.mjs) over every issue and
#   pull request title, body, comment, review and review comment, release, commit comment, and
#   every commit message on main, against .private-references-baseline.
# - gitleaks-history: secrets in the full history of every branch and tag, against the reviewed
#   fingerprints in .gitleaksignore, with inline allow tags ignored.
# - trufflehog: secrets in the repository, its issues and its pull request comments, verified
#   results only, with inline ignore tags ignored.
#
# THE LOGS ARE PUBLIC. Each job prints a location, a kind and a redacted form, never a value;
# TruffleHog's JSON (which carries the raw secret and the committer's address) goes to a file that
# is read by jq and never printed, uploaded or attached. No issue is opened: a red run is the alert.
#
# Every job calibrates on a planted positive in the same run, and fails if the detector misses it.
name: Published text scan

on:
  schedule:
    - cron: '41 5 * * *' # daily; the odd minute avoids the top-of-hour crush
  workflow_dispatch:

concurrency:
  group: published-text-scan

permissions:
  contents: read

jobs:
  private-references:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      # Full history, because every commit message on main is read and the count is checked
      # against `git rev-list --count HEAD`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc

      - name: Matcher over issues, pull requests, comments, releases and commit messages
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/published-text-scan.mjs "$GITHUB_REPOSITORY" .private-references-baseline

  gitleaks-history:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc

      - name: Install gitleaks (pinned, checksum verified, calibrated)
        run: |
          ./scripts/install-gitleaks.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Every branch and tag the checkout fetched, not only HEAD, because a secret removed from
      # main's tip is still in the history a clone receives. The script scans a bare mirror twice:
      # without `.gitleaksignore`, where the findings must be exactly the reviewed ones it lists
      # (a new one fails, and so does an entry nothing matches), and with it, where gitleaks must
      # report nothing. Reports go to a temporary directory; only counts and fingerprints (commit,
      # file, rule, line: no value) reach this public log, inside `::stop-commands::`.
      - name: gitleaks over the full history of every ref
        run: node scripts/private-references-git.mjs history

  # TruffleHog's GitHub mode cannot run here (#849): it asks `GET /user` before reading anything, and
  # the Actions token is an integration token, refused with « 403 Resource not accessible by
  # integration ». Every run from #757 to 2026-10-07 died there, before its first issue. So the text
  # is fetched by the same script and completeness check as the private-references job, written one
  # file per item, and TruffleHog reads the folder and the git history with no token at all.
  trufflehog:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
      pull-requests: read
    env:
      # 3.97.9, pinned by index digest so a moved tag cannot change what runs.
      IMAGE: ghcr.io/trufflesecurity/trufflehog@sha256:52e67fef4d054ecff5c2ce4b4ae376626d1ef54aa0898b53cac19c25e92e14db
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc

      # Refuses, like the private-references job, when it read fewer issues, pull requests or commit
      # messages than the repository reports.
      - name: Write every issue, pull request, comment, release and commit message to files
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/published-text-scan.mjs "$GITHUB_REPOSITORY" --dump "$RUNNER_TEMP/published"

      # One pass over the text and one over the git history. A planted credential, assembled at run
      # time so no file carries one, sits in the text folder and must be reported by THIS pass, so a
      # scan that read nothing cannot pass. Gated: a result TruffleHog verified live against its
      # provider. Unverified results are counted, not gated: they are dominated by the test fixtures'
      # throwaway database URLs. `--no-ignore-tag` so an inline comment cannot hide a finding, and
      # `--fail-on-scan-errors` so a scan that broke part-way does not pass for a clean one.
      - name: TruffleHog over the published text and the git history, calibrated in the same pass
        run: |
          published="$RUNNER_TEMP/published"
          # Two plants: one in a .env, one in a .txt like every dumped file, so the pass must prove it
          # reads the dump's own file type (contradiction pass on #916, F1).
          for plant in zz-planted-calibration.env zz-planted-calibration.txt; do
            printf 'DATABASE_URL=postgres://%s:%s@%s:5432/app\n' planted "pw$(openssl rand -hex 8)" db.planted.invalid \
              > "$published/$plant"
          done
          files=$(find "$published" -type f | wc -l)
          empty=$(find "$published" -type f -empty | wc -l)
          set +e
          docker run --rm -v "$published:/scan:ro" "$IMAGE" filesystem /scan \
            --results=verified,unverified,unknown --no-ignore-tag --fail-on-scan-errors --no-update --json --log-level=2 \
            > "$RUNNER_TEMP/text.jsonl" 2> "$RUNNER_TEMP/text.log"
          text_status=$?
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" "$IMAGE" git file:///repo \
            --results=verified --no-ignore-tag --fail-on-scan-errors --no-update --json --log-level=2 \
            > "$RUNNER_TEMP/git.jsonl" 2> "$RUNNER_TEMP/git.log"
          git_status=$?
          set -e

          # What each pass logged, by message name and count, and an error's own text, each on one line
          # with control characters replaced, inside a stop-commands block, so nothing TruffleHog logs
          # can be read by the runner as a workflow command. No field value other than an error's text.
          token=$(openssl rand -hex 16)
          echo "::stop-commands::${token}"
          for pass in text git; do
            echo "== $pass pass"
            jq -rR 'fromjson? | "\(.level // "?") \(.msg // "?" | tostring | gsub("[[:cntrl:]]"; " "))"' "$RUNNER_TEMP/$pass.log" | sort | uniq -c | sort -rn | head -25
            jq -rR 'fromjson? | select(.level == "error") | "error: \(.msg): \(.error // "" | tostring | gsub("[[:cntrl:]]"; " ") | .[0:300])"' "$RUNNER_TEMP/$pass.log"
            jq -rR 'fromjson? | select(.msg == "finished scanning") | "read \(.chunks) chunks, \(.bytes) bytes"' "$RUNNER_TEMP/$pass.log"
          done
          echo "::${token}::"

          refuse() { echo "REFUSED: $1" >&2; exit 1; }
          [ "$text_status" -eq 0 ] || refuse "the text pass exited $text_status"
          [ "$git_status" -eq 0 ] || refuse "the git pass exited $git_status"
          for plant in zz-planted-calibration.env zz-planted-calibration.txt; do
            planted=$(jq -s --arg plant "$plant" '[.[] | select(.SourceMetadata.Data.Filesystem.file | tostring | endswith($plant))] | length' "$RUNNER_TEMP/text.jsonl")
            echo "calibration: $plant reported $planted time(s), expected 1"
            [ "$planted" -eq 1 ] || refuse "the text pass did not report $plant, so a clean result would mean nothing"
          done
          # A sum, so it shows the scan did not stop early; it cannot show that no single file was
          # skipped (one long item yields several chunks). Empty files (a review with no text) yield
          # none, so they are counted out.
          echo "$files files written, $empty of them empty"
          chunks=$(jq -nR '[inputs | fromjson? | select(.msg == "finished scanning") | .chunks] | first // 0' "$RUNNER_TEMP/text.log")
          [ "$chunks" -ge "$((files - empty))" ] || refuse "the text pass read $chunks chunks for $((files - empty)) non-empty files"
          git_chunks=$(jq -nR '[inputs | fromjson? | select(.msg == "finished scanning") | .chunks] | first // 0' "$RUNNER_TEMP/git.log")
          [ "$git_chunks" -gt 0 ] || refuse "the git pass read 0 chunks"

          # Detector and location only, for verified results. The JSON also carries the raw secret,
          # which may not reach this public log; locations sit inside a stop-commands block.
          unverified=$(jq -s '[.[] | select(.Verified | not)] | length' "$RUNNER_TEMP/text.jsonl" "$RUNNER_TEMP/git.jsonl")
          verified=$(jq -s '[.[] | select(.Verified)] | length' "$RUNNER_TEMP/text.jsonl" "$RUNNER_TEMP/git.jsonl")
          echo "results: $verified verified (gated), $unverified unverified (counted, not gated)"
          token=$(openssl rand -hex 16)
          echo "::stop-commands::${token}"
          jq -r 'select(.Verified) | "\(.DetectorName) at \(.SourceMetadata.Data.Filesystem.file // .SourceMetadata.Data.Git.commit // "unknown location") \(.SourceMetadata.Data.Git.file // "")"' \
            "$RUNNER_TEMP/text.jsonl" "$RUNNER_TEMP/git.jsonl"
          echo "::${token}::"
          [ "$verified" -eq 0 ] || refuse "$verified verified secret(s) in published text or history"
