name: release-please

on:
  push:
    branches: [main]

# Least privilege: read-only by default, writes scoped to the one job (OpenSSF Token-Permissions).
permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Releases created via the default GITHUB_TOKEN do NOT emit a `release: published`
      # event to other workflows (GitHub's recursion guard) — docker-publish.yml would
      # silently never trigger. A PAT (RELEASE_PLEASE_PAT) makes the release attributable
      # to a real actor, so the event fires normally.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_PAT }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
