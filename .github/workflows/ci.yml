name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # The vitest "client" project (component tests) runs against a real Chromium via
      # @vitest/browser-playwright, and the e2e suite needs it too — installed once here,
      # ahead of test:unit, and reused (via cache + a no-op re-check) by test:e2e later.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Type + Svelte check
        run: npm run check

      - name: Unit tests
        run: npm run test:unit -- --run

      - name: Build
        run: npm run build
        env:
          # Only DATABASE_URL is required at build time (SvelteKit's postbuild analysis step
          # touches src/lib/server/db.ts, which fails fast if unset under NODE_ENV=production).
          DATABASE_URL: file:./dev.db

      - name: E2E tests
        run: npm run test:e2e
