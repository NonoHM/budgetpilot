name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# The repository's default token is read/write, because the Dependabot auto-merge workflow needs
# it. Nothing in this workflow does: every job checks out, installs, and runs a check. Declared
# here so a new job inherits the narrow token rather than the repository default.
permissions:
  contents: read

jobs:
  # Split from a single sequential job into independent parallel jobs: lint and type-check
  # only need `npm ci` + Prisma client generation, not the build/test artifacts, so they gain
  # nothing from running after unit tests/build/e2e. Each job pays its own `npm ci`/`prisma
  # generate` cost (npm's install is cached via setup-node's `cache: npm`, and Prisma codegen
  # is a few seconds), which is cheap next to the wall-clock time saved by not serializing them
  # behind the much longer test-and-build job.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma clients
        run: npm run db:generate

      # prisma/schema.prisma is the authored source; the PostgreSQL and MySQL schemas are
      # derived from it and committed. Regenerating here and comparing catches the one failure
      # this design exists to prevent: a field added to the source and never propagated, which
      # nothing else notices until an operator's upgrade on that provider fails.
      - name: Check generated Prisma schemas are up to date
        run: npm run db:schemas:check

      - name: Lint
        run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma clients
        run: npm run db:generate

      # npm run check also compiles Paraglide translations (paraglide:compile) internally.
      - name: Type + Svelte check
        run: npm run check

  # Unit tests, the production-build smoke check, and e2e stay sequential in one job: unit
  # tests and the build are cheap and fail fast, so a broken build never triggers the much
  # pricier e2e run (which does its own separate build internally, isolated from this smoke
  # build's env/DB, against a dedicated throwaway DB — see e2e/config.ts).
  test-and-build:
    runs-on: ubuntu-latest
    # 25 rather than something near the ~3m30s this normally takes, because the Playwright step
    # below is allowed 15 on its own: the step timeout has to be the one that fires, so a
    # failure names the thing that stalled instead of the whole job.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma clients
        run: npm run db:generate

      # The vitest "client" project (component tests) runs against a real Chromium via
      # @vitest/browser-playwright, and the e2e suite needs it too — installed once here,
      # ahead of test:unit, and reused (via cache + a no-op re-check) by test:e2e later.
      # Chromium only: playwright.config.ts scopes `projects` to chromium (matches this
      # install and vite.config.ts's browser instance) — installing/running the default
      # Firefox/WebKit projects here would fail with no system deps installed for them.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # `--with-deps` is not optional here — it is what installs Chromium's system libraries,
      # and without them the browser fails to launch with a missing-shared-object error rather
      # than anything about Playwright. But it shells out to apt-get, which is where this step
      # can stop being a 25-second no-op: it waits on the dpkg lock if unattended-upgrades is
      # still running on a fresh runner, and Ubuntu's needrestart can open an interactive prompt
      # mid-install that nothing will ever answer. Both are silent — the step simply sits there.
      # Seen once at eight minutes and still climbing on a run whose cache had hit.
      #
      # The two variables make the apt path answer its own questions; timeout-minutes is what
      # turns a hang into a failed job instead of an occupied runner. Job-level timeouts above
      # are the backstop for the same class of problem elsewhere, in the same spirit as the
      # 30-minute one docker-smoke.yml already carries.
      #
      # 15 and not something tighter, and the number comes from the incident rather than from
      # taste: that step did not hang forever, it took 10m21s and then succeeded. A bound below
      # that turns a slow run into a red one, which is how a timeout starts costing more than
      # the problem it guards. This one only catches a stall worse than any observed.
      - name: Install Playwright Chromium
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: npx playwright install --with-deps chromium

      - name: Unit tests
        run: npm run test:unit -- --run

      - name: Build
        run: npm run build
        env:
          # SvelteKit's postbuild analysis step imports every server module to find
          # prerendering candidates, which runs each module's top-level validation — so this
          # must cover every env var any src/lib/server/**/*.ts throws on at import time if
          # unset, not just the ones the app touches at request time. Currently that's
          # db.ts (DATABASE_URL), crypto.ts (TOTP_ENCRYPTION_KEY), and rateLimit.ts
          # (RATE_LIMIT_HASH_SECRET) — grep `is required` under src/lib/server for the
          # current list if this ever needs updating. Checks that need the database live
          # in hooks.server.ts's `init` hook instead, which this step never runs. All three
          # values below are throwaway, CI-only fakes, never copied from a real .env.
          DATABASE_URL: file:./dev.db
          # Must be valid 64-hex-char (32-byte) input for crypto.ts's decode check; the
          # repeating pattern signals "obviously not a real key" rather than looking random.
          TOTP_ENCRYPTION_KEY: 'c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1'
          RATE_LIMIT_HASH_SECRET: 'ci-only-fake-rate-limit-hash-secret-do-not-reuse'

      - name: E2E tests
        run: npm run test:e2e

  # Multi-database support that is never exercised against the other engines is a claim, not a
  # feature. Everything else in this workflow runs on SQLite, whose binary collation and
  # single-writer locking hide exactly the failures this job exists to catch: a folded duplicate
  # a case-insensitive collation would have accepted, two concurrent writers under an isolation
  # level that does not serialize them, a caught unique violation on an engine that aborts the
  # enclosing transaction.
  #
  # One job definition, one matrix leg per engine. The `db` service takes its image and health
  # probe from the leg; the credentials below are throwaway values for a container that lives
  # and dies inside this job, never copied from anywhere real.
  db-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: postgresql
            image: postgres:17-alpine
            port: 5432
            health-cmd: pg_isready -U budgetpilot -d budgetpilot
            url: postgresql://budgetpilot:budgetpilot@127.0.0.1:5432/budgetpilot
          # MariaDB rather than MySQL: it is what a self-hoster is most likely to already run,
          # it shares the `mysql` Prisma provider, and it is the stricter of the two for what
          # this job checks (its default collation is accent- and case-insensitive).
          - provider: mysql
            image: mariadb:11
            port: 3306
            health-cmd: healthcheck.sh --connect --innodb_initialized
            url: mysql://budgetpilot:budgetpilot@127.0.0.1:3306/budgetpilot

    services:
      db:
        image: ${{ matrix.image }}
        # Both images ignore the other's variables, so one block serves both legs.
        env:
          POSTGRES_USER: budgetpilot
          POSTGRES_PASSWORD: budgetpilot
          POSTGRES_DB: budgetpilot
          MARIADB_USER: budgetpilot
          MARIADB_PASSWORD: budgetpilot
          MARIADB_DATABASE: budgetpilot
          MARIADB_ROOT_PASSWORD: budgetpilot-root
        ports:
          - ${{ matrix.port }}:${{ matrix.port }}
        options: >-
          --health-cmd "${{ matrix.health-cmd }}"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    env:
      DATABASE_PROVIDER: ${{ matrix.provider }}
      DATABASE_URL: ${{ matrix.url }}
      # Same throwaway CI-only fakes as the build step above, for the modules the suite imports.
      TOTP_ENCRYPTION_KEY: 'c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1'
      RATE_LIMIT_HASH_SECRET: 'ci-only-fake-rate-limit-hash-secret-do-not-reuse'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # All three, not just this leg's: the app imports every provider's generated client
      # statically, so the suite will not load without all three on disk. Which one actually
      # connects is decided at runtime by DATABASE_PROVIDER above.
      - name: Generate Prisma clients
        run: npm run db:generate

      # The provider's own migration history, applied to an empty database — the upgrade path an
      # operator on this engine actually takes.
      - name: Apply migrations
        run: npx prisma migrate deploy

      # Applying without error is not the same as arriving where the schema says. Each provider's
      # history evolves on its own, so a hand-written migration that diverges from the authored
      # model — a column left NULLable, an index never created — passes the step above and every
      # test that does not happen to touch it, then surfaces as a constraint failure on the one
      # engine an operator happens to run. `db:schemas:check` proves the three *schemas* stay in
      # sync with the source; nothing until now proved the three *migration histories* converge on
      # them.
      #
      # The path is derived from DATABASE_PROVIDER rather than carried as a matrix key on
      # purpose: GitHub builds a matrix job's name from every value in its `include` entry, so
      # adding one renames both legs — and the branch ruleset requires them by name. A new key
      # here silently retires two required status checks and blocks every merge until someone
      # notices. Same rule for anything added to this matrix later.
      - name: Check the migration history reaches the schema
        run: npx prisma migrate diff --from-config-datasource --to-schema "prisma/schema.$DATABASE_PROVIDER.prisma" --exit-code

      - name: Cross-provider suite
        run: npm run test:db

  # SQLite's own migration history, checked the same way the db-matrix legs check theirs.
  #
  # It gets its own job because it needs no service container, and it needs checking most: it is
  # by far the longest of the three (it predates multi-provider support, where the other two start
  # from a squashed init), it is what almost every install actually runs, and until now nothing
  # ever applied it to an empty database and compared the result against the schema. The e2e suite
  # migrates a database, but it asserts about the app, not about the shape it landed on.
  #
  # No `db:generate`: `migrate deploy` and `migrate diff` are CLI operations against the schema
  # files, and prisma.config.ts imports only the dependency-free provider module.
  sqlite-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_PROVIDER: sqlite
      DATABASE_URL: file:/tmp/ci-migration-check.db
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations to an empty database
        run: npx prisma migrate deploy

      - name: Check the migration history reaches the schema
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

  # Every Compose file combination the docs hand an operator, merged and validated. Same blind
  # spot as the three Prisma clients, one layer up: the overlays are only ever used stacked, and
  # nothing checked any stack of them. Needs no npm install — docker compose ships on the runner.
  compose-combinations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Validate every documented Compose combination
        run: ./scripts/check-compose-combinations.sh

  # The Docker image, built for real and booted on every provider. Nothing else in this workflow
  # builds it — see .github/workflows/docker-smoke.yml.
  docker-smoke:
    uses: ./.github/workflows/docker-smoke.yml

  # The image's CVE inventory, on every pull request. Nothing else in CI looked at it: Dependabot
  # reads `package.json`, and `package.json` is not what ships. `@sveltejs/kit` is declared as a
  # devDependency, so its alerts auto-dismiss as `development` scope — while
  # `bits-ui -> runed -> @sveltejs/kit -> vite -> postcss -> nanoid` is installed by
  # `npm ci --omit=dev`, which is exactly what the Dockerfile's prod-deps stage runs. Three CVEs
  # reached a shipped image with zero open Dependabot alerts (#164). Only a scan of the image saw
  # them, and until now the earliest such scan ran after the release was already published (#165).
  #
  # THE POLICY IS COPIED FROM THE PUBLISH GATE ON PURPOSE, and that is the whole value: a green
  # check here answers the same question `docker-publish.yml`'s gate asks at release time. Any
  # divergence — a different severity set, a different `ignore-unfixed` — would make this a check
  # that passes while the release still cannot ship, which is worse than not having it.
  #
  #   severity: CRITICAL,HIGH   MEDIUM and LOW are inventory, not a release blocker. They reach
  #                             the Security tab through trivy-scheduled.yml, which deliberately
  #                             scans without any filter.
  #   ignore-unfixed: true      Measured before choosing it, not assumed: today's image carries
  #                             7 LOW, 5 MEDIUM and 1 UNKNOWN, every one of them glibc or zlib1g
  #                             with no fixed version published by Debian. With this flag the
  #                             image has ZERO findings at any severity, so a Debian-unfixed
  #                             finding cannot put a red X on an unrelated pull request. Without
  #                             it, every PR would be red for something no rebuild can remove.
  #   TRIVY_IGNOREFILE          `.trivyignore` must not be able to make this check disagree with
  #                             the release gate, in either direction.
  #
  # The noise mode this DOES have, stated rather than discovered: a CVE published upstream
  # overnight turns every open pull request red at once, with no commit to blame. That reading is
  # accurate — those branches genuinely cannot be released — and the remedy is one `npm update`
  # on `main`, committed as `fix(deps)`. It is not a reason to downgrade the gate to a report.
  #
  # amd64 only, where the publish gate scans both platform digests. The node-pkg findings are
  # architecture-independent and both digests come from one distroless index and one Debian
  # snapshot; the per-platform claim stays where it is verified, at publish.
  image-cve:
    runs-on: ubuntu-latest
    # A cold image build installs two full dependency trees. Set at all so a hung build fails
    # instead of running to the six-hour default.
    timeout-minutes: 25
    steps:
      # Two things, not one: the build context, AND `.trivyignore` — Trivy auto-detects it in the
      # working directory. The gate below opts out of it explicitly, but the SARIF-free scan here
      # would otherwise silently change meaning when that file is edited.
      - uses: actions/checkout@v7

      # Deliberately a plain `docker build`, matching scripts/docker-smoke.sh: the artifact under
      # test must be the one the Dockerfile produces, not a buildx variant with a different layer
      # set. docker-smoke builds its own copy and force-removes it in a cleanup trap on every exit
      # path, so there is nothing to reuse — the second build is the cost of scanning an image
      # that still exists when the scan runs.
      - name: Build the runtime image
        run: docker build -t budgetpilot:cve-scan .

      # Runs first for two reasons. It records EVERY severity, unfixed included, so the findings
      # the gate deliberately ignores stay readable by whoever is looking; and it is what installs
      # `trivy` on PATH and warms the vulnerability DB, so the probe and the gate below cost cached
      # scans rather than three downloads. No exit-code: this step reports, it does not decide.
      #
      # JSON, then rendered — never `format: table`. Trivy's table prints one row per scanned
      # TARGET including every clean one: 651 lines for 2 findings on the published image. A log
      # nobody scrolls through is the same failure as an alert nobody reads.
      - name: Scan every severity
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: budgetpilot:cve-scan
          scanners: vuln
          format: json
          output: image-cve-full.json

      # Into the job summary rather than only the log, because this is the one CI job whose output
      # a reviewer is expected to read on a PR that changes no dependency at all.
      - name: Show the findings
        run: ./scripts/trivy-report.sh image-cve-full.json "every severity, unfixed included" | tee -a "$GITHUB_STEP_SUMMARY"

      # A scanner that sees zero packages exits 0 and the gate below passes green while proving
      # nothing. The publish gate carries this probe for the same reason; a PR check that can pass
      # vacuously is the one shape that is worse than no check.
      - name: Refuse to gate on an empty package inventory
        run: |
          count=$(trivy image --quiet --scanners vuln --format json --list-all-pkgs budgetpilot:cve-scan \
            | jq '[.Results[]?.Packages? // []] | flatten | length')
          echo "package inventory: $count"
          if [ "$count" -eq 0 ]; then
            echo "the scanner saw zero packages. This gate would pass while proving nothing" >&2
            exit 1
          fi

      - name: Gate on fixable CRITICAL/HIGH
        id: gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_IGNOREFILE: /dev/null # must not be able to disagree with the release gate
        with:
          scan-type: image
          image-ref: budgetpilot:cve-scan
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: json
          output: image-cve-gate.json

      # Only what blocked the PR, at the top of the summary. The step above already listed
      # everything; repeating it here would put the actionable rows back under the ignorable ones,
      # which is the whole problem this rendering exists to remove.
      - name: Say what blocked
        if: always() && steps.gate.outcome == 'failure'
        run: ./scripts/trivy-report.sh image-cve-gate.json "Blocking findings (fixable CRITICAL/HIGH)" >> "$GITHUB_STEP_SUMMARY"
