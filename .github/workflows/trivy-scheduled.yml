# Scheduled CVE scan of the *published* image. Per-release scans only run when someone cuts a
# release; the runtime base (distroless) rebuilds on Debian's cadence with no CVE SLA, so a
# known CVE can appear in the already-published image with zero commits to trigger anything.
# This is the alerting the Chainguard-vs-distroless decision explicitly budgeted for.
#
# Deliberately WITHOUT ignore-unfixed, unlike the publish gate: this workflow's job is
# awareness, including "Debian has not fixed it yet" — the reader decides whether to wait for
# the base to rebuild, cut a release to pick up a fixed layer, or mitigate. A red run also
# produces GitHub's normal workflow-failure notification on top of the issue.
#
# Daily is cheap (one pull + one scan, vulnerability DB cached between runs); if it ever
# flakes on registry rate limits, drop the cron to '0 6 * * 1,4'.
name: Scheduled image scan

on:
  schedule:
    - cron: '17 6 * * *' # daily; the odd minute avoids the top-of-hour GH cron crush
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan-published:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write # the cve-alert issue below
      security-events: write # upload-sarif
    steps:
      # Only for upload-sarif's source context; the scan targets the published image.
      - uses: actions/checkout@v7

      - name: Lowercase image name (GHCR requires it)
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "ref=ghcr.io/${REPOSITORY,,}:latest" >> "$GITHUB_OUTPUT"

      # No severity filter and no exit-code here: the Security tab gets the complete
      # inventory and filters natively. Policy (CRITICAL/HIGH) is applied by the gate
      # step below, not by what gets recorded.
      - name: Scan published image — full inventory as SARIF
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.image.outputs.ref }}
          scanners: vuln
          format: sarif
          output: trivy-published.sarif

      # Same place CodeQL's default-setup results live, so code-level and image-level
      # findings share one view. Runs on the default branch (schedule/dispatch context),
      # which is exactly where the Security tab's default alert list looks.
      - name: Upload scan results to the Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-published.sarif
          category: trivy-published-image

      - name: Fail on CRITICAL/HIGH (including Debian-unfixed)
        id: gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.image.outputs.ref }}
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: '1'
          format: table
          output: trivy-report.txt
          skip-setup-trivy: true

      - name: Show the report in the log
        if: always()
        run: cat trivy-report.txt 2>/dev/null || echo "no report file produced"

      # One open cve-alert issue at a time: new findings land as comments on it rather than
      # as duplicate issues. `steps.gate.outcome` (not bare failure()) so an infrastructure
      # failure in the scan or upload steps does not file a CVE alert about nothing.
      # Everything interpolated into the body is repo-derived, no user-controlled input.
      - name: Open or update the alert issue
        if: failure() && steps.gate.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "Scheduled Trivy scan found CRITICAL/HIGH CVEs in \`$IMAGE_REF\`."
            echo
            echo "Run: $RUN_URL"
            echo
            echo '```'
            head -c 60000 trivy-report.txt
            echo
            echo '```'
          } > /tmp/cve-alert-body.md
          existing=$(gh issue list --label cve-alert --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file /tmp/cve-alert-body.md
          else
            gh issue create \
              --title "CVE alert: CRITICAL/HIGH finding in published image" \
              --label cve-alert \
              --body-file /tmp/cve-alert-body.md
          fi
