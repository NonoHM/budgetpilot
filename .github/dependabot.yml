version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
    groups:
      npm-lint-tooling:
        patterns:
          - 'eslint*'
          - 'prettier*'
          - '@typescript-eslint/*'
          - 'typescript-eslint'
        update-types:
          - patch
          - minor
      # The Prisma CLI, the client and the driver adapters must move together. They are
      # separately versioned packages that share one internal contract: a client generated by
      # one CLI version and handed an adapter from another fails at runtime, and the error
      # blames the adapter rather than the skew. Grouping them means a bump is one PR that
      # either passes the db-matrix on all three providers or fails visibly.
      npm-prisma:
        patterns:
          - 'prisma'
          - '@prisma/client'
          - '@prisma/adapter-*'
        update-types:
          - patch
          - minor
      npm-patch-minor:
        exclude-patterns:
          - 'eslint*'
          - 'prettier*'
          - '@typescript-eslint/*'
          - 'typescript-eslint'
          - 'prisma'
          - '@prisma/client'
          - '@prisma/adapter-*'
        update-types:
          - patch
          - minor
    ignore:
      # @types/node tracks the Node runtime major, which is pinned at 24
      # (.nvmrc, CI's node-version-file, four Dockerfile stages). Typing the
      # codebase against Node 25/26 APIs the runtime doesn't have would be a
      # silent mismatch, so every major above 24 is blocked until the runtime
      # itself is bumped to a newer LTS.
      - dependency-name: '@types/node'
        versions: ['>=25.0.0']
      # TypeScript 7 cannot land while typescript-eslint caps its peer range at
      # ">=4.8.4 <6.1.0" — 8.65.0 is the latest published version and still caps
      # it, so `npm run lint` would break with no newer release to upgrade to.
      # Revisit once upstream ships TS 7 support.
      - dependency-name: 'typescript'
        versions: ['7.x']
      # 9.3.0 replaced the DOM XML parser with a SAX one and introduced a real
      # regression: `readFiles()` in xlsx/parseSpreadsheetContents.js returns
      # a plain object (not a Promise) whenever every nested parse call
      # resolves synchronously (small/simple .xlsx files), but the caller
      # unconditionally chains `.then()` on it — `TypeError: readFiles(...)
      # .then is not a function`. Reproduced against the real 9.3.4 package
      # (latest as of this writing), not just our test fixture. Revisit once
      # upstream ships a fix past 9.3.4.
      - dependency-name: 'read-excel-file'
        versions: ['>=9.3.0']

  # Covers every `uses:` in .github/workflows — the major-tag pins on trusted orgs
  # (actions/*, docker/*, github/*) and the SHA pins on third-party actions
  # (aquasecurity/trivy-action, anchore/sbom-action); for SHA pins Dependabot moves the
  # digest and the trailing version comment together. Majors arrive as individual PRs,
  # which is wanted: an action major (new Node runtime, changed inputs) is reviewed on
  # its own, only patch/minor land grouped. This whole ecosystem is excluded from
  # dependabot-auto-merge.yml — its PRs edit workflow files, i.e. what runs with the
  # repo's token, so a human reads every one of them regardless of semver level.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      actions-patch-minor:
        update-types:
          - patch
          - minor

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      docker-patch-minor:
        update-types:
          - patch
          - minor
    ignore:
      # Node 26 is a deliberate runtime decision, not a dependency bump: the
      # version is pinned in .nvmrc, in CI via node-version-file, and across all
      # four Dockerfile stages, so moving it is a coordinated change reviewed on
      # its own merits (PR #1 was closed for that reason). Scoped to 26.x only —
      # 24.x patches still surface, and a future major would too.
      - dependency-name: 'node'
        versions: ['26.x']
