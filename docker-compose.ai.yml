# Optional local-AI overlay. Combine with either base compose file:
#   docker compose -f docker-compose.yml -f docker-compose.ai.yml up -d --build
#   docker compose -f docker-compose.prebuilt.yml -f docker-compose.ai.yml up -d
#
# Adds a self-hosted Ollama service on the internal Compose network and points
# the app at it. Requires an NVIDIA GPU + nvidia-container-toolkit on the host
# for the `deploy.resources` block below; on a machine without a GPU, remove
# that block and Ollama will run on CPU (functional, slower).
#
# Adding this overlay IS the opt-in: LLM_ENABLED is forced to true below, so
# the stack can never end up in the state this file used to allow: an Ollama
# container running, a model downloaded, and the app ignoring all of it
# because .env still said LLM_ENABLED=false, with nothing explaining why.
# .env's own LLM_ENABLED still governs the setups that don't use this overlay
# (bare metal, `npm run dev`). See docs/ai-insights.md.
services:
  budgetpilot:
    depends_on:
      - ollama
    environment:
      LLM_ENABLED: 'true'
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_BASE_URL: http://ollama:11434
      # Defaults mirror .env.example so this overlay also works with the
      # minimal .env of the prebuilt-image setup, where these are absent.
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:0.5b}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-10000}
      LLM_ALLOWED_HOSTS: ${LLM_ALLOWED_HOSTS:-localhost,127.0.0.1,::1},ollama
      LLM_HTTP_PERMITTED_HOSTS: ${LLM_HTTP_PERMITTED_HOSTS:-},ollama

  ollama:
    image: ollama/ollama
    container_name: budgetpilot_ollama
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  ollama_data:
